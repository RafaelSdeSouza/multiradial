name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: pytest --ignore=tests/test_preprocessing_regression.py
      - run: python -c "from radialpaths import build_geometry, radial_profile"

  paper-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/paper-reproduction.txt ".[test]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build twine ".[test]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip uninstall -y radialpaths
      - run: python -m pip install --no-deps dist/radialpaths-0.1.0-py3-none-any.whl
      - run: pytest -q --ignore=tests/test_preprocessing_regression.py
      - run: python -c "from radialpaths import build_geometry, radial_profile; import numpy as np; support=np.zeros((9, 9), dtype=bool); support[1:-1, 1:-1]=True; geometry=build_geometry(support, [(4, 4)]); profile=radial_profile(np.ones((9, 9)), geometry); assert profile.median.shape == (1, 30)"
      - run: python -m pip uninstall -y radialpaths
      - run: python -m pip install --no-deps --no-build-isolation dist/radialpaths-0.1.0.tar.gz
      - run: python -c "import radialpaths; assert radialpaths.__version__ == '0.1.0'"
