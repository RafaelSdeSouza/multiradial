name: deploy-browser-demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jupyterlite.yml"
      - "app/**"
      - "examples/**"
      - "src/**"
      - "tools/build_pages.py"
      - "web/**"
      - "pyproject.toml"
      - "jupyter_lite_config.json"
      - "README.md"
      - "CITATION.cff"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install build ".[demo]"
          jupyterlite-core==0.8.3 jupyterlite-pyodide-kernel==0.8.3
          jupyter-server
      - run: python -m build --wheel
      - run: python tools/build_pages.py --output _site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
